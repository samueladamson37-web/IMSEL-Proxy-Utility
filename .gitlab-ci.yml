# GitLab Pages: сборка только проверенных публичных страниц.
# Сайт публикуется на gitlab-docs.imsel.dev (Settings -> Pages -> New Domain).
pages:
  stage: deploy
  image: alpine:3.20
  variables:
    MDBOOK_VERSION: "v0.4.40"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - apk add --no-cache curl tar python3
    - python3 scripts/validate-docs.py
    - python3 -m unittest discover -s tests -v
    - curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /usr/local/bin
    - python3 scripts/build-docs.py
  artifacts:
    paths:
      - public

validate-docs:
  stage: test
  image: python:3.12-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"'
  script:
    - python scripts/validate-docs.py
    - python -m unittest discover -s tests -v
